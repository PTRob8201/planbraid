<html lang="en">
<head><meta charset="utf-8"><title>Account extensions test</title></head>
<body>
<pre id="result">Running...</pre>
<iframe id="app-frame" title="Synthetic PlanBraid" style="width:390px;height:700px"></iframe>
<script>
async function run() {
    const mock = `
        const realFetch = window.fetch;
        const access = {pmEnabled: false, supplyEnabled: false, supplyRole: 'technician'};
        window.fetch = async (url, options = {}) => {
            if (!String(url).includes('api.php?action=')) return realFetch(url, options);
            const action = new URL(url, document.baseURI).searchParams.get('action');
            const body = options.body ? JSON.parse(options.body) : {};
            const responses = {
                session: {csrf: 'fixture', authenticated: true, ...access},
                load: {username: 'synthetic', userId: 1, isAdmin: true, email: '',
                       guideSeen: true, revision: 0, state: null, ...access},
                save: {revision: (body.revision || 0) + 1},
                'accounts-list': {users: [
                    {id: 1, username: 'admin', isAdmin: true, enabled: true, email: '', ...access},
                    {id: 2, username: 'test', isAdmin: false, enabled: true, email: '',
                     pmEnabled: true, supplyEnabled: false, supplyRole: 'office'}
                ]},
                'account-extensions': {message: 'Saved'}
            };
            if (action === 'account-extensions') window.savedAccess = body;
            return new Response(JSON.stringify(responses[action] || {}), {status: 200});
        };
    `;
    const base = new URL('../', location.href).href;
    const html = await (await fetch('../index.html')).text();
    const frame = document.getElementById('app-frame');
    frame.srcdoc = html.replace('<head>', `<head><base href="${base}"><script>${mock}<\/script>`);
    await new Promise(resolve => frame.addEventListener('load', resolve, {once: true}));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    for (let i = 0; i < 100 && doc.getElementById('app').hidden; i++) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    if (doc.getElementById('app').hidden) throw new Error('Synthetic account did not load');
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const source = doc.querySelector('#top-menu .source-code-link');
    assert(source && source.href.endsWith(`/tree/${doc.getElementById('release-version').textContent}`),
        'Source link must match the running release');
    assert(source.target === '_blank' && source.rel.includes('noopener'), 'Source link must open safely');
    win.showLicense();
    assert(doc.querySelector('.license-modal a[href]').href === source.href,
        'License dialog must link to the same source release');
    win.closeModal();
    await win.showAccounts();
    const forms = doc.querySelectorAll('.extension-form');
    assert(forms.length === 2, 'Expected two account forms');
    const role = forms[0].querySelector('.supply-role');
    assert(role.hidden && win.getComputedStyle(role).display === 'none', 'Role should start hidden');
    assert(!forms[1].querySelector('.supply-role').hidden, 'PM should show the role');
    forms[0].elements.pmEnabled.click();
    assert(!role.hidden, 'PM should show the role');
    forms[0].elements.supplyEnabled.click();
    forms[0].elements.pmEnabled.click();
    assert(!role.hidden, 'Supply should show the role');
    forms[0].elements.supplyRole.value = 'office';
    forms[0].elements.supplyEnabled.click();
    assert(role.hidden && forms[0].elements.supplyRole.value === 'office', 'Hiding must retain the role');
    forms[0].requestSubmit();
    for (let i = 0; i < 100 && !win.savedAccess; i++) await new Promise(resolve => setTimeout(resolve, 10));
    assert(win.savedAccess && !win.savedAccess.pmEnabled && !win.savedAccess.supplyEnabled &&
        win.savedAccess.supplyRole === 'office', 'Saving must preserve the hidden role');
    document.getElementById('result').textContent = 'PASS';
}
run().catch(error => {
    document.getElementById('result').textContent = 'FAIL: ' + error.message;
    console.error(error);
});
</script>
</body>
</html>
