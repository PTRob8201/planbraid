<html lang="en">
<head><meta charset="utf-8"><title>Sidebar swipe test</title></head>
<body>
<pre id="result">Running...</pre>
<iframe id="app-frame" title="Synthetic PlanBraid" style="width:390px;height:700px"></iframe>
<script>
async function run() {
    const mock = `
        const realFetch = window.fetch;
        window.fetch = async (url, options = {}) => {
            if (!String(url).includes('api.php?action=')) return realFetch(url, options);
            const action = new URL(url, document.baseURI).searchParams.get('action');
            const body = options.body ? JSON.parse(options.body) : {};
            const access = {pmEnabled: false, supplyEnabled: false, supplyRole: 'technician'};
            const responses = {
                session: {csrf: 'fixture', authenticated: true, ...access},
                load: {username: 'synthetic', userId: 1, isAdmin: false, email: '',
                       guideSeen: true, revision: 0, state: null, ...access},
                save: {revision: (body.revision || 0) + 1}
            };
            return new Response(JSON.stringify(responses[action] || {}), {status: 200});
        };
    `;
    const base = new URL('../', location.href).href;
    const html = await (await fetch('../index.html')).text();
    const frame = document.getElementById('app-frame');
    frame.srcdoc = html.replace('<head>', `<head><base href="${base}"><script>${mock}<\/script>`);
    await new Promise(resolve => frame.addEventListener('load', resolve, {once: true}));
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    for (let i = 0; i < 100 && doc.getElementById('app').hidden; i++) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }
    const sidebar = doc.getElementById('sidebar');
    const target = doc.getElementById('dashboard-content');
    const toggle = doc.getElementById('sidebar-toggle');
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const touch = (element, id, x, y) => new win.Touch({identifier: id, target: element, clientX: x, clientY: y});
    const fire = (element, type, touches, changed) => element.dispatchEvent(new win.TouchEvent(type, {
        bubbles: true, touches, targetTouches: touches, changedTouches: changed
    }));
    const swipe = (element, x, y, endX, endY, cancel = false) => {
        const start = touch(element, 1, x, y);
        const end = touch(element, 1, endX, endY);
        fire(element, 'touchstart', [start], [start]);
        fire(element, cancel ? 'touchcancel' : 'touchend', [], [end]);
    };
    assert(!doc.getElementById('app').hidden && sidebar.hidden, 'Initial sidebar state');
    swipe(target, 80, 200, 180, 200);
    swipe(target, 15, 200, 50, 201);
    swipe(target, 15, 200, 95, 320);
    swipe(target, 15, 200, 105, 203, true);
    assert(sidebar.hidden, 'Non-edge, short, vertical or cancelled swipe opened the sidebar');
    const first = touch(target, 1, 15, 200);
    const second = touch(target, 2, 20, 200);
    fire(target, 'touchstart', [first], [first]);
    fire(target, 'touchstart', [first, second], [second]);
    fire(target, 'touchend', [], [touch(target, 1, 105, 200)]);
    assert(sidebar.hidden, 'Multi-touch opened the sidebar');
    swipe(target, 15, 200, 105, 203);
    assert(!sidebar.hidden && toggle.getAttribute('aria-expanded') === 'true', 'Edge swipe did not open the sidebar');
    swipe(sidebar, 190, 200, 183, 300);
    assert(!sidebar.hidden, 'Vertical sidebar scroll closed the sidebar');
    swipe(sidebar, 190, 200, 90, 202);
    assert(sidebar.hidden && toggle.getAttribute('aria-expanded') === 'false', 'Sidebar swipe did not close it');
    document.getElementById('result').textContent = 'PASS';
}
run().catch(error => {
    document.getElementById('result').textContent = 'FAIL: ' + error.message;
    console.error(error);
});
</script>
</body>
</html>
